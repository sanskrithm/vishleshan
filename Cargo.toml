[package]
name = "panini_rs"
version = "0.1.0"
edition = "2021"
authors = ["Pāṇini-RS Compiler Team"]
description = "A morphology-driven Sanskrit DSL for high-performance data processing"

[dependencies]
polars = { version = "0.35", features = ["lazy"] }

[[bin]]
name = "panini_rs"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
